description: >-
  Entity graph derived from the published OpenAPI. WebScraping.AI is a stateless transformation
  API — it stores no user-owned resources and exposes no identifiers to reference. The only
  persistent entity is the caller's own Account; everything else is a per-request projection of
  a third-party web page. There are consequently no id-reference fields and no
  has_one/has_many relationships between server-side objects.
shape: stateless-transformation
