  - {name: remaining_total_credits, type: integer, description: Total remaining credits}
  - {name: resets_at, type: integer, description: Unix timestamp of the monthly quota reset}
  - {name: remaining_concurrency, type: integer, description: Concurrent-request headroom}
- name: SelectedAreas
  schema: '#/components/schemas/SelectedAreas'
  kind: response-projection
  persistent: false
  description: Array of HTML strings, one per element matched by the supplied selectors.
  produced_by: [getSelectedMultiple]
- name: Error
  schema: '#/components/schemas/Error'
  kind: envelope
  persistent: false
  description: Flat error envelope; carries the TARGET page's status alongside the message.
