  schema: '#/components/schemas/Account'
  kind: singleton
  persistent: true
  identifier: none (implicit — resolved from the api_key)
  read_by: [account]
  fields:
  - {name: email, type: string, description: Account email}
  - {name: remaining_api_calls, type: integer, deprecated: true, description: Deprecated alias
