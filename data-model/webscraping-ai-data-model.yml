observations:
- No id-prefix convention exists, because no server-side object is ever assigned an id.
- The response shape of getFields is defined by the caller's `fields` argument, which is why the
  spec cannot declare a concrete schema for it — a real constraint for agents doing typed
  deserialization.
- Credit accounting is the only stateful concept, and it is readable through one operation.
