description: >-
  Binds each WebScraping.AI MCP tool to the OpenAPI operation that backs it. WebScraping.AI is
  an unusually clean case: the MCP surface is a 1:1 projection of the REST surface — seven tools,
  seven operations, no MCP-only composites and no REST operations without a tool. Each tool's
  real input contract is the bound operation's `parameters` block in
  openapi/webscraping-ai-openapi.yml.
surfaces:
