    file: openapi/webscraping-ai-openapi.yml
    source: https://webscraping.ai/openapi.yml
    version: 3.2.1
    server: https://api.webscraping.ai
    gated: false
  mcp:
    url: https://mcp.webscraping.ai/mcp
    transport: streamable-http
    gated: true
    gated_note: >-
      tools/list requires an OAuth 2.1 bearer token (401 anonymously). Tool names and input
      shapes were taken from the provider's open-source stdio server, which the docs state
      exposes the same 7 tools.
  graphql: null
  proxy_mode:
    endpoint: proxy.webscraping.ai:8888
    note: >-
      HTTP proxy front-end for the same scraping core; not modeled in the OpenAPI and not
      exposed as an MCP tool.
