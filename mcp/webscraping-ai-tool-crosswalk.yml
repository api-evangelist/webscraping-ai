divergences:
- kind: response-shaping
  detail: >-
    The MCP server sanitizes and truncates page content before returning it, and wraps HTML /
    selected results in a JSON envelope when format=json. The REST operations return the raw
    payload. Same data core, different presentation.
- kind: auth
  detail: >-
    REST authenticates with an `api_key` query parameter; the hosted MCP server authenticates
    with OAuth 2.1 and issues no API key. The local stdio MCP server uses the API key.
- kind: parameter-defaults
  detail: >-
    The MCP server applies its own defaults (js rendering and residential proxy configurable via
    environment variables) on top of the REST defaults (js=true, proxy=datacenter).
