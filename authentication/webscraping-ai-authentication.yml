- name: api_key
  type: apiKey
  in: query
  parameter: api_key
  description: >-
    All REST API requests require an API key passed as the `api_key` query-string
    parameter. There is no header form documented. The docs warn the key must not be
    exposed in client-side code.
  applies_to: https://api.webscraping.ai
  sources:
  - openapi/webscraping-ai-openapi.yml
  - https://webscraping.ai/docs
- name: proxy_basic_auth
  type: http
  scheme: basic
  description: >-
    Proxy Mode (proxy.webscraping.ai:8888) authenticates with HTTP proxy credentials —
    the username is the API key and the password carries the request parameters
    (e.g. `js=true&proxy=residential`). The proxy presents a self-signed certificate.
  applies_to: http://proxy.webscraping.ai:8888
  sources:
  - https://webscraping.ai/docs
- name: mcp_oauth2
  type: oauth2
  description: >-
    The hosted remote MCP server (https://mcp.webscraping.ai/mcp) is protected by OAuth 2.1
    with PKCE and dynamic client registration — no API key is used. Anonymous requests are
    rejected with 401 and a RFC 9728 `WWW-Authenticate: Bearer resource_metadata=...` challenge.
  flows:
  - flow: authorizationCode
    authorizationUrl: https://webscraping.ai/oauth/authorize
    tokenUrl: https://webscraping.ai/oauth/token
    registrationEndpoint: https://webscraping.ai/oauth/register
    revocationEndpoint: https://webscraping.ai/oauth/revoke
    code_challenge_methods: [S256]
    grant_types: [authorization_code, refresh_token]
    token_endpoint_auth_methods: [none, client_secret_basic, client_secret_post]
    scopes: {}
  sources:
  - well-known/webscraping-ai-oauth-authorization-server.json
  - well-known/webscraping-ai-oauth-protected-resource.json
notes:
